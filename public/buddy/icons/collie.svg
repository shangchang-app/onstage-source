<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 叼着 Demo 的边牧 · chibi, drawn to sit alongside Noto Color Emoji -->
  <defs>
    <linearGradient id="k" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A5C64"/><stop offset="1" stop-color="#3A3C42"/></linearGradient>
    <linearGradient id="kd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#45474E"/><stop offset="1" stop-color="#2E3035"/></linearGradient>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECE8E2"/></linearGradient>
  </defs>

  <!-- tail (behind body) -->
  <path d="M86,96 C100,96 110,88 113,76 C115,69 107,66 104,72 C101,80 95,85 86,86 Z" fill="url(#k)"/>
  <ellipse cx="109" cy="72" rx="6" ry="6.5" fill="url(#w)"/>

  <!-- back legs (peek out at the sides, attached under the body) -->
  <rect x="36" y="94" width="13" height="22" rx="6.5" fill="url(#kd)"/>
  <rect x="79" y="94" width="13" height="22" rx="6.5" fill="url(#kd)"/>
  <ellipse cx="42.5" cy="116" rx="7" ry="4.6" fill="url(#w)"/>
  <ellipse cx="85.5" cy="116" rx="7" ry="4.6" fill="url(#w)"/>

  <!-- body -->
  <path d="M34,92 C34,79 46,72 64,72 C82,72 94,79 94,92 C94,104 82,110 64,110 C46,110 34,104 34,92 Z" fill="url(#k)"/>
  <!-- white chest -->
  <path d="M50,80 C56,74 72,74 78,80 C80,92 72,102 64,103 C56,102 48,92 50,80 Z" fill="url(#w)"/>

  <!-- front legs (black with white paws) -->
  <rect x="48" y="96" width="14" height="24" rx="7" fill="url(#k)"/>
  <rect x="66" y="96" width="14" height="24" rx="7" fill="url(#k)"/>
  <ellipse cx="55" cy="119" rx="7.8" ry="5" fill="url(#w)"/>
  <ellipse cx="73" cy="119" rx="7.8" ry="5" fill="url(#w)"/>
  <path d="M52.5,118.5 v3 M57.5,118.5 v3 M70.5,118.5 v3 M75.5,118.5 v3" stroke="#D3CDC5" stroke-width="1.3" stroke-linecap="round"/>

  <!-- ears: symmetric, set on the top corners of the head, tips flopping outward -->
  <path d="M30,44 C24,30 26,14 36,11 C44,9 52,18 54,30 Z" fill="url(#k)"/>
  <path d="M27,22 C28,14 33,10 39,11 C40,17 35,23 27,26 Z" fill="#2B2D32"/>
  <path d="M98,44 C104,30 102,14 92,11 C84,9 76,18 74,30 Z" fill="url(#k)"/>
  <path d="M101,22 C100,14 95,10 89,11 C88,17 93,23 101,26 Z" fill="#2B2D32"/>

  <!-- head: big & round -->
  <ellipse cx="64" cy="50" rx="38" ry="34" fill="url(#k)"/>
  <!-- white blaze into a round muzzle -->
  <path d="M60,17 C62,16 66,16 68,17 L69,42 C81,45 88,54 86,64 C83,76 45,76 42,64 C40,54 47,45 59,42 Z" fill="url(#w)"/>
  <!-- tan brows -->
  <ellipse cx="47" cy="38" rx="4.6" ry="2.8" fill="#DDA466"/>
  <ellipse cx="81" cy="38" rx="4.6" ry="2.8" fill="#DDA466"/>
  <!-- big eyes -->
  <ellipse cx="48" cy="49" rx="5.8" ry="6.8" fill="#141414"/>
  <ellipse cx="80" cy="49" rx="5.8" ry="6.8" fill="#141414"/>
  <circle cx="50.2" cy="46.4" r="2.1" fill="#fff"/><circle cx="46.6" cy="51.6" r="1" fill="#fff"/>
  <circle cx="82.2" cy="46.4" r="2.1" fill="#fff"/><circle cx="78.6" cy="51.6" r="1" fill="#fff"/>
  <!-- blush on the muzzle -->
  <ellipse cx="49" cy="63" rx="5" ry="3" fill="#F6A6A0" opacity=".6"/>
  <ellipse cx="79" cy="63" rx="5" ry="3" fill="#F6A6A0" opacity=".6"/>
  <!-- nose + smile -->
  <path d="M58,55 C58,52 70,52 70,55 C70,58.5 66.5,61 64,61 C61.5,61 58,58.5 58,55 Z" fill="#1C1C1C"/>
  <ellipse cx="62" cy="54.2" rx="2.2" ry="1" fill="#fff" opacity=".5"/>

  <!-- demo card held in the mouth, dangling to one side -->
  <g transform="translate(-4 1) rotate(-12 80 74)">
    <rect x="66" y="64" width="34" height="22" rx="4" fill="#fff" stroke="#D3D8E1" stroke-width="1.3"/>
    <rect x="70" y="68" width="13" height="14" rx="2.5" fill="#4C8DF6"/>
    <path d="M74.5,71.5 L79.5,75 L74.5,78.5 Z" fill="#fff"/>
    <rect x="86" y="69" width="10" height="2.8" rx="1.4" fill="#C6CCD7"/>
    <rect x="86" y="74" width="7" height="2.8" rx="1.4" fill="#C6CCD7"/>
    <rect x="86" y="79" width="9" height="2.8" rx="1.4" fill="#C6CCD7"/>
  </g>
  <path d="M64,61 C64,64.5 60.5,66 57.5,64.5 M64,61 C64,64.5 67.5,66 70.5,64.5" stroke="#2A2A2A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M68.5,63.8 C69.5,66.5 71.5,67.5 73.5,66.8" stroke="#2A2A2A" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
