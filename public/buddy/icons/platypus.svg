<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 不按物种出牌的鸭嘴兽 · chibi, front-facing, drawn to sit alongside Noto Color Emoji -->
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07B55"/><stop offset="1" stop-color="#8A5A3B"/></linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7E5539"/><stop offset="1" stop-color="#5E3D28"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A8494"/><stop offset="1" stop-color="#4E5664"/></linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9B08C"/><stop offset="1" stop-color="#C39670"/></linearGradient>
  </defs>

  <!-- flat paddle tail, peeking out behind on the right -->
  <g transform="rotate(-28 100 96)">
    <ellipse cx="100" cy="96" rx="22" ry="12.5" fill="url(#t)"/>
    <path d="M86,92 L94,101 M93,88 L103,100 M101,87 L110,98 M109,89 L115,96" stroke="#93694B" stroke-width="1.6" stroke-linecap="round" opacity=".75"/>
  </g>

  <!-- body -->
  <ellipse cx="64" cy="92" rx="33" ry="27" fill="url(#f)"/>
  <ellipse cx="64" cy="97" rx="21" ry="17" fill="url(#l)"/>

  <!-- webbed feet -->
  <path d="M38,112 C38,106 58,106 58,112 C58,116 55,119 52,118 C51,120 45,120 44,118 C41,119 38,116 38,112 Z" fill="url(#b)"/>
  <path d="M70,112 C70,106 90,106 90,112 C90,116 87,119 84,118 C83,120 77,120 76,118 C73,119 70,116 70,112 Z" fill="url(#b)"/>

  <!-- little webbed hands on the belly -->
  <path d="M44,86 C40,90 41,97 46,98 C50,99 54,96 53,91 Z" fill="url(#b)"/>
  <path d="M84,86 C88,90 87,97 82,98 C78,99 74,96 75,91 Z" fill="url(#b)"/>

  <!-- head: big & round -->
  <circle cx="64" cy="50" r="33" fill="url(#f)"/>
  <!-- eyes -->
  <ellipse cx="49" cy="43" rx="5.4" ry="6.4" fill="#141414"/>
  <ellipse cx="79" cy="43" rx="5.4" ry="6.4" fill="#141414"/>
  <circle cx="51" cy="40.5" r="2" fill="#fff"/><circle cx="47.6" cy="45.6" r=".9" fill="#fff"/>
  <circle cx="81" cy="40.5" r="2" fill="#fff"/><circle cx="77.6" cy="45.6" r=".9" fill="#fff"/>
  <!-- blush -->
  <ellipse cx="38" cy="54" rx="5" ry="3" fill="#F2A08F" opacity=".55"/>
  <ellipse cx="90" cy="54" rx="5" ry="3" fill="#F2A08F" opacity=".55"/>
  <!-- wide flat bill, slightly smiling -->
  <path d="M34,61 C34,53 48,50 64,50 C80,50 94,53 94,61 C94,72 80,78 64,78 C48,78 34,72 34,61 Z" fill="url(#b)"/>
  <path d="M40,58 C44,54 56,53 64,53 C72,53 84,54 88,58 C80,57 72,56.5 64,56.5 C56,56.5 48,57 40,58 Z" fill="#fff" opacity=".22"/>
  <ellipse cx="58" cy="59" rx="1.8" ry="1.2" fill="#353B45"/>
  <ellipse cx="70" cy="59" rx="1.8" ry="1.2" fill="#353B45"/>
  <path d="M44,66 C54,72.5 74,72.5 84,66" stroke="#8C96A6" stroke-width="2.2" fill="none" stroke-linecap="round"/>
</svg>
