name: Build, test and preview
# 每次推送到 main（也就是 PR 合并之后）：在干净环境里安装、测试、构建线上发布包和预览；发布包发到 Releases（预发布），
# 预览部署到本仓库的 GitHub Pages（https://<用户名>.github.io/<本仓库名>/）。**不会改动正式站**：正式站在另一个仓库 shangchang-app/onstage，
# 只有手动把发布包换上去才会更新。
# 部署成功之后，verify-deployed-preview 才去打开真实的预览网址，核对页面、二维码入口和提交号；合并前的检查在 ci.yml。
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install (npm ci)
        run: npm ci 2>&1 | tee ci-install.log
      - name: Typecheck and unit tests
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ci-typecheck.log
          npm test 2>&1 | tee ci-unit.log
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Build release package for the live site (/onstage) and run static tests
        run: |
          set -o pipefail
          npm run build:static 2>&1 | tee ci-build-live.log
          PAGES_BASE=/onstage npm run test:pages 2>&1 | tee ci-pages-live.log
          npm run package:pages 2>&1 | tee ci-package.log
          mkdir -p out/live && cp -r release/* out/live/ && cp dist-pages/version.json out/live/
          mv test-results out/test-results-live
      - name: Build preview (/onstage-source) and run static tests
        run: |
          set -o pipefail
          npm run build:static -- --base=/${{ github.event.repository.name }} 2>&1 | tee ci-build-preview.log
          PAGES_BASE=/${{ github.event.repository.name }} npm run test:pages 2>&1 | tee ci-pages-preview.log
          cp -r dist-pages preview-build
          mv test-results out/test-results-preview
      - name: Same-origin upgrade and rollback test (live V1.4.1 -> new -> V1.4.1 -> new)
        run: |
          set -o pipefail
          # 线上当前发布包：线上仓库提交 5eed8ae 里的 site.zip，先核对校验值
          curl -sSfL -o live-site.zip https://github.com/shangchang-app/onstage/raw/5eed8ae/site.zip
          echo "10d61ad446206bcc95fcf76827a61d54b5bae5f06f2b6fd35c0c7b6e0cb44f23  live-site.zip" | sha256sum -c - 2>&1 | tee ci-rollback.log
          mkdir -p live-old && unzip -q live-site.zip -d live-old
          npm run test:rollback -- live-old preview-build 2>&1 | tee -a ci-rollback.log
          mv test-results out/test-results-rollback
      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-screenshots
          path: |
            ci-*.log
            out/
          if-no-files-found: warn
      - name: Keep release package (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: out/live/
      - name: Publish release package (Releases)
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          VER=$(node -p "require('./package.json').version")
          SHA=$(cut -d' ' -f1 out/live/*.sha256)
          printf '自动构建：提交 %s\n\n发布包（网址前缀 /onstage，用于线上仓库 shangchang-app/onstage）：\n- 文件：%s\n- SHA256：%s\n\nversion.json：\n```\n%s\n```\n' "$GITHUB_SHA" "$(ls out/live/*.zip | xargs -n1 basename)" "$SHA" "$(cat out/live/version.json)" > notes.md
          gh release create "build-$SHORT" out/live/*.zip out/live/*.sha256 out/live/release.json --prerelease --title "构建 $SHORT（$VER）" --notes-file notes.md --target "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-deployed-preview:
    # 部署成功之后才运行：打开真实的预览网址，核对分享卡二维码指向的 /buddy/ 能打开、是隐藏工位搭子，
    # 而且页面页脚和 version.json 都是这次的提交（只解码出网址不算数）。GitHub Pages 生效可能有延迟，所以重试。
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Open the deployed preview and its QR target
        run: |
          set -o pipefail
          SHORT=$(git rev-parse --short HEAD)
          SITE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          node scripts/check-qr-target.mjs "$SITE/buddy/" --commit "$SHORT" --retries 12 --wait 20 2>&1 | tee verify-preview.log
          curl -sSf "$SITE/" | grep -q "on stage" || { echo "::error::预览首页打不开或不是 on stage"; exit 1; }
          echo "### 部署后检查：$SITE/buddy/ 可以打开，提交 $SHORT" >> "$GITHUB_STEP_SUMMARY"
